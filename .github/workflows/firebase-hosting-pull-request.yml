name: Comprobar propuesta de cambio de la web
on:
  pull_request:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - name: Publicación de prueba para propuestas del mismo repositorio
        if: vars.VITE_API_BASE_URL != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUCADATOS_3617C }}
          projectId: educadatos-3617c
